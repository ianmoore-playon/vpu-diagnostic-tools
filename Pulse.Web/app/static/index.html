<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Web | VPU Diagnostics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        pulse: {
                            bg:      'var(--c-bg)',
                            sidebar: 'var(--c-surface-2)',
                            card:    'var(--c-surface)',
                            border:  'var(--c-border)',
                            accent:  '#3b82f6',
                            text:    'var(--c-text)',
                            muted:   'var(--c-muted)',
                        }
                    }
                }
            }
        }
        // Apply saved theme before first paint
        if (localStorage.getItem('pulse-theme') === 'light') {
            document.documentElement.classList.add('light');
        }
    </script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="dark h-full bg-pulse-bg text-pulse-text overflow-hidden">
    <div id="app" class="flex h-full">
        <nav id="sidebar" class="w-56 bg-pulse-sidebar border-r border-pulse-border flex flex-col flex-shrink-0">
            <div class="sidebar-brand">
                <svg class="brand-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
                </svg>
                <div>
                    <h1 class="text-base font-bold text-pulse-text tracking-tight leading-tight">Pulse Web</h1>
                    <p class="text-[10px] text-pulse-muted leading-tight">VPU Diagnostics</p>
                </div>
            </div>
            <div id="demo-banner" class="demo-banner hidden">DEMO DATA</div>
            <div class="flex-1 overflow-y-auto py-1" id="nav-links"></div>
            <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light/dark mode"></button>
            <div class="sidebar-footer"></div>
        </nav>
        <main id="content" class="flex-1 overflow-y-auto p-6">
            <div class="max-w-6xl mx-auto" id="page"></div>
        </main>
        <div id="log-pane" class="log-pane">
            <div class="log-pane-header">
                <div class="log-tabs">
                    <button class="log-tab log-tab-active" data-log-tab="script" onclick="switchLogTab('script')">Script Log</button>
                    <button class="log-tab" data-log-tab="server" onclick="switchLogTab('server')">Server Log</button>
                </div>
                <span class="log-toggle-icon" onclick="toggleLogPane()">&#9650;</span>
            </div>
            <div class="log-body" data-log-body="script"></div>
            <div class="log-body log-body-hidden" data-log-body="server"></div>
        </div>
    </div>
    <script src="/static/app.js"></script>
</body>
</html>
