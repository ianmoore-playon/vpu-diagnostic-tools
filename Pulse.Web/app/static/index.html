<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulse Web | VPU Diagnostics</title>
    <link rel="icon" type="image/png" href="/static/img/pulse-full-transparent.png">
    <link rel="apple-touch-icon" href="/static/img/pulse-full-transparent.png">
    <link rel="stylesheet" href="/static/tailwind-min.css">
    <link rel="stylesheet" href="/static/style.css">
    <script>
        // Theme detection runs before first paint to avoid flash.
        // Priority: saved preference > system preference > light (default).
        (function() {
            var saved = localStorage.getItem('pulse-theme');
            if (saved === 'dark') {
                document.documentElement.classList.add('dark');
            } else if (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
</head>
<body class="h-full bg-pulse-bg text-pulse-text overflow-hidden">
    <!-- Splash screen — visible until ALL preload sections finish loading.
         App.js calls hideSplash() once preloadProgressive() resolves, and
         showSplash() when refreshAll() re-runs diagnostics. The logo div
         picks its background image from CSS based on html.dark — no JS
         needed to swap themes. -->
    <div id="splash" class="splash" role="status" aria-live="polite">
        <div class="splash-logo" aria-label="Pulse"></div>
        <div class="splash-version" id="splash-version">{{PULSE_VERSION}}</div>
        <div class="splash-progress">
            <div id="splash-progress-fill" class="splash-progress-fill"></div>
        </div>
        <div class="splash-status">
            <div class="splash-verb"  id="splash-verb">Loading diagnostics…</div>
            <div class="splash-count" id="splash-count">&nbsp;</div>
        </div>
        <!-- Live checklist — one row per diagnostic section, ticked off as
             each one settles. Populated by _buildSplashChecklist() from
             PAGE_API so the order and labels stay in sync with what's
             actually fetched. aria-hidden: the polite count line above is
             what gets announced; the grid is decorative progress. -->
        <div class="splash-checklist" id="splash-checklist" aria-hidden="true"></div>
        <!-- Issue banner — surfaces critical/warning findings from the
             dashboard the moment it loads (it's fetched first), so a tech
             sees there's a problem before the full UI even paints. Hidden
             on a clean system; populated by _setSplashIssues(). -->
        <div class="splash-issues" id="splash-issues" role="alert"></div>
        <!-- Static reassurance line. Pulse runs a lot more checks than it
             used to, so set the expectation up front. preloadProgressive
             escalates this to a calmer "still working" message if a slow
             box runs long. -->
        <div class="splash-note" id="splash-note">Running a full diagnostic sweep. This can take a moment.</div>
    </div>
    <div id="app" class="flex h-full">
        <nav id="sidebar" class="w-56 bg-pulse-sidebar border-r border-pulse-border flex flex-col flex-shrink-0">
            <div class="sidebar-brand">
                <div class="sidebar-brand-logo" role="img" aria-label="Pulse"></div>
                <p class="sidebar-brand-tagline">VPU Diagnostics</p>
            </div>
            <div id="demo-banner" class="demo-banner hidden">DEMO DATA</div>
            <div class="flex-1 overflow-y-auto py-1" id="nav-links"></div>
            <button id="theme-toggle" class="theme-toggle-btn" onclick="toggleTheme()" title="Toggle light/dark mode"></button>
            <div class="sidebar-powered">
                <span class="powered-by-label">Powered by</span>
                <img class="powered-by-logo" src="/static/img/playon.png" alt="PlayOn" />
            </div>
            <div class="sidebar-footer"></div>
        </nav>
        <main id="content" class="flex-1 overflow-y-auto p-6">
            <div class="max-w-6xl mx-auto" id="page"></div>
        </main>
    </div>
    <!-- LMI auto-close countdown (hidden unless the server is counting
         down to close after the LogMeIn session ended — see app.js
         _updateLmiCountdown). -->
    <div id="lmi-countdown" class="lmi-countdown hidden" role="alert" aria-live="assertive"></div>
    <script src="/static/app.js"></script>
</body>
</html>
