# Build Pulse.WPF on a Windows runner.
#
# Branch channels:
#   beta  — integration branch; feature branches merge here first.
#           Artifacts are named Pulse.WPF-beta-*. Tags beta-v* create
#           a pre-release mirrored to pulse-releases.
#   main  — stable production branch. Artifacts are named Pulse.WPF-*.
#           Tags wpf-pilot-v* create a production release mirrored to
#           pulse-releases.

name: Build Pulse.WPF

on:
  push:
    branches: [ "beta", "main" ]
    paths:
      - "Pulse.WPF/**"
      - ".github/workflows/wpf-pilot-build.yml"
    tags: [ "wpf-pilot-v*", "beta-v*" ]
  workflow_dispatch:

permissions:
  contents: write   # needed to upload release assets on tag pushes

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK (builds net48 targets)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Pulse.WPF/Pulse.WPF/Pulse.WPF.csproj

      - name: Build (Release, net48)
        run: dotnet build Pulse.WPF/Pulse.WPF/Pulse.WPF.csproj -c Release --no-restore

      - name: Publish (framework-dependent, win-x64)
        run: >
          dotnet publish Pulse.WPF/Pulse.WPF/Pulse.WPF.csproj
          -c Release
          -r win-x64
          --self-contained false
          -o publish

      - name: Stage the runnable folder
        shell: pwsh
        run: |
          # Determine channel: beta branch/tags get a "beta" prefix; main is clean.
          $ref = "${{ github.ref }}"
          $isBeta = $ref -eq "refs/heads/beta" -or $ref.StartsWith("refs/tags/beta-v")
          $channel = if ($isBeta) { "Pulse.WPF-beta" } else { "Pulse.WPF" }
          $sha = "${{ github.sha }}".Substring(0,7)
          $stamp = (Get-Date).ToString("yyyyMMdd-HHmm")
          $name = "$channel-$stamp-$sha"
          Write-Host "Bundle name: $name"
          New-Item -ItemType Directory -Force "release" | Out-Null
          Copy-Item -Recurse publish "release/$name"
          Compress-Archive -Path "release/$name" -DestinationPath "release/$name.zip"
          # NOTE: the per-release launcher .bat is intentionally NOT generated
          # here anymore. Earlier builds shipped a Pulse.WPF-pilot-Launcher.bat
          # inside each release zip with the tag + zip filename hard-coded at
          # build time, so anyone who saved that .bat to a desktop kept pulling
          # the same pinned build forever (a footgun that looked like an auto-
          # updater). The single supported entrypoint is now the static
          # Pulse.WPF.bat that lives at the root of ianmoore-playon/pulse-releases,
          # which calls install.ps1 -> /releases/latest every run.
          echo "ARTIFACT_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "ARTIFACT_ZIP=release/$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload as workflow artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_ZIP }}

      # ── Production release (main channel, wpf-pilot-v* tags) ────────────────
      - name: Publish production release (source repo)
        if: startsWith(github.ref, 'refs/tags/wpf-pilot-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_ZIP }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          body: |
            Pulse.WPF production build.

            **Internal source-repo release.** The public-facing copy is mirrored
            to ianmoore-playon/pulse-releases automatically — that's where
            techs and contractors download from.

            Install path on a VPU:
            - `Pulse.WPF.bat` (static, lives at the root of pulse-releases) — auto-updates every launch
            - or the one-liner: `irm https://raw.githubusercontent.com/ianmoore-playon/pulse-releases/main/install.ps1 | iex`

      - name: Mirror production release to pulse-releases
        if: startsWith(github.ref, 'refs/tags/wpf-pilot-v')
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_PAT }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $publicRepo = "ianmoore-playon/pulse-releases"
          gh release delete $tag --repo $publicRepo --yes --cleanup-tag 2>$null
          gh release create $tag `
            --repo $publicRepo `
            --target main `
            --title "Pulse.WPF $tag" `
            --notes "Pulse.WPF production build.`n`n**Install on a VPU**`n`nDrop ``Pulse.WPF.bat`` on the VPU desktop and double-click — it auto-updates every launch.`n`nOr the one-liner:`n``````powershell`nirm https://raw.githubusercontent.com/ianmoore-playon/pulse-releases/main/install.ps1 | iex`n```````n`nRequires .NET Framework 4.8 (pre-installed on every VPU)." `
            ${{ env.ARTIFACT_ZIP }}
          Write-Host "Mirrored production release $tag to $publicRepo"

      # ── Beta pre-release (beta channel, beta-v* tags) ────────────────────────
      - name: Publish beta pre-release (source repo)
        if: startsWith(github.ref, 'refs/tags/beta-v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARTIFACT_ZIP }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          body: |
            Pulse.WPF beta build — not yet promoted to main.

            **Internal source-repo pre-release.** Mirrored to pulse-releases
            as a pre-release asset for testing.

      - name: Mirror beta pre-release to pulse-releases
        if: startsWith(github.ref, 'refs/tags/beta-v')
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_PAT }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $publicRepo = "ianmoore-playon/pulse-releases"
          gh release delete $tag --repo $publicRepo --yes --cleanup-tag 2>$null
          gh release create $tag `
            --repo $publicRepo `
            --target main `
            --prerelease `
            --title "Pulse.WPF $tag (beta)" `
            --notes "Pulse.WPF beta build — not yet promoted to main.`n`nFor testing only. Use the production release for VPU installs." `
            ${{ env.ARTIFACT_ZIP }}
          Write-Host "Mirrored beta pre-release $tag to $publicRepo"
