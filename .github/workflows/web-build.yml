# Package Pulse.Web and publish as a GitHub release.
#
# No build step — just zip the Pulse.Web/ tree and release it.
# Tags web-v* create a production release mirrored to pulse-releases.
# Tags web-beta-v* create a beta pre-release mirrored to pulse-releases.
# Tags web-dev-v* create a dev pre-release mirrored to pulse-releases.

name: Build Pulse.Web

on:
  push:
    tags: [ "web-v*", "web-beta-v*", "web-dev-v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Create release zip
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          STAMP=$(date +%Y%m%d-%H%M)
          SHA="${GITHUB_SHA:0:7}"
          if echo "$TAG" | grep -q "^web-dev-"; then
            NAME="Pulse.Web-dev-${STAMP}-${SHA}"
          elif echo "$TAG" | grep -q "^web-beta-"; then
            NAME="Pulse.Web-beta-${STAMP}-${SHA}"
          else
            NAME="Pulse.Web-${STAMP}-${SHA}"
          fi
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "ARTIFACT_ZIP=${NAME}.zip" >> "$GITHUB_ENV"
          echo "$TAG" > Pulse.Web/VERSION
          cd Pulse.Web
          zip -r "../${NAME}.zip" . -x "app/python/*" "__pycache__/*" "*.pyc"

      - name: Extract changelog notes
        run: |
          # Top section of the changelog (between the first two "## " headings),
          # minus its heading line — becomes the body of the release notes the
          # in-app updater shows. Generic fallback if empty/missing so a release
          # never fails on a missing-notes file.
          awk '/^## /{s++; if(s==1) next; if(s==2) exit} s>=1{print}' \
            Pulse.Web/CHANGELOG.md > CHANGELOG_BODY.md 2>/dev/null || true
          if [ ! -s CHANGELOG_BODY.md ]; then
            echo "- Maintenance and internal improvements." > CHANGELOG_BODY.md
          fi
          echo "Release-notes body:"; cat CHANGELOG_BODY.md

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_ZIP }}

      # ── Clean up stale releases (keeps only the new tag's release) ──────
      - name: Delete older releases in same channel
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          # Determine channel prefix for cleanup
          if echo "$TAG" | grep -q "^web-dev-"; then
            PATTERN="web-dev-v"
          elif echo "$TAG" | grep -q "^web-beta-"; then
            PATTERN="web-beta-v"
          else
            PATTERN="web-v"
          fi
          gh release list --limit 50 \
            | awk -F'\t' '$3 ~ /^'"$PATTERN"'/ && $3 != "'"$TAG"'" {print $3}' \
            | while read -r old; do
                echo "Deleting old release: $old"
                gh release delete "$old" --yes 2>/dev/null || true
              done
          gh release delete "$TAG" --yes 2>/dev/null || true
          echo "Cleaned up stale releases for channel ${PATTERN}*"

      # ── Production release (web-v* tags, excluding beta/dev) ───────────
      - name: Publish release (source repo)
        if: startsWith(github.ref, 'refs/tags/web-v') && !startsWith(github.ref, 'refs/tags/web-beta-') && !startsWith(github.ref, 'refs/tags/web-dev-')
        uses: softprops/action-gh-release@v2
        with:
          # Ship the channel launcher alongside the app zip — testers/installers
          # only need the .bat; downloading it from the release pins them to a
          # known-good launcher paired with this build.
          files: |
            ${{ env.ARTIFACT_ZIP }}
            runners/run_pulse_web.bat
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: false
          body: |
            Pulse.Web release.

            Public release published on this repo. Field VPUs install via
            `run_pulse_web.bat`, which auto-updates from here every launch.

            Install on a VPU:
            - Drop `run_pulse_web.bat` on the desktop and double-click — auto-updates every launch.

      # ── Beta pre-release (beta channel, web-beta-v* tags) ──────────────
      - name: Publish beta pre-release (source repo)
        if: startsWith(github.ref, 'refs/tags/web-beta-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT_ZIP }}
            runners/run_pulse_web_beta.bat
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          body: |
            Pulse.Web beta build — not yet promoted to main.

            **Internal source-repo pre-release.** Mirrored to pulse-releases
            as a pre-release asset for testing.

      # ── Dev pre-release (dev channel, web-dev-v* tags) ─────────────────
      - name: Publish dev pre-release (source repo)
        if: startsWith(github.ref, 'refs/tags/web-dev-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT_ZIP }}
            runners/run_pulse_web_dev.bat
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: true
          body: |
            Pulse.Web dev build — internal testing only.

            **Internal source-repo pre-release.** Mirrored to pulse-releases
            as a pre-release asset for dev testing.

