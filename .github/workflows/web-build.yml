# Package Pulse.Web and publish as a GitHub release.
#
# No build step — just zip the Pulse.Web/ tree and publish it on this repo.
# Tags web-v* create a production release.
# Tags web-beta-v* create a beta pre-release.
# Tags web-dev-v* create a dev pre-release.
#
# Runs two ways:
#   - directly, on a manual tag push (beta / production tags), and
#   - as a reusable workflow called by web-auto-tag.yml with the tag it just
#     created. Tags pushed with the default GITHUB_TOKEN do NOT fire tag-push
#     triggers (GitHub's anti-recursion rule), so the auto-tag workflow must
#     call this one explicitly — dev releases only exist because of that call.
# The RELEASE_TAG env resolves the tag in both modes; a plain workflow_dispatch
# from a branch packages a zip artifact but publishes nothing.

name: Build Pulse.Web

on:
  push:
    tags: [ "web-v*", "web-beta-v*", "web-dev-v*" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: "Existing web-* tag to package and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      # Tag-push runs resolve from the ref; workflow_call runs from the input.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          # For workflow_call the triggering ref is the caller's branch, so
          # check out the tag itself; empty input falls back to the event ref.
          ref: ${{ inputs.tag || github.ref }}

      - name: Create release zip
        run: |
          TAG="${RELEASE_TAG:-dev}"
          STAMP=$(date +%Y%m%d-%H%M)
          SHA="${GITHUB_SHA:0:7}"
          if echo "$TAG" | grep -q "^web-dev-"; then
            NAME="Pulse.Web-dev-${STAMP}-${SHA}"
          elif echo "$TAG" | grep -q "^web-beta-"; then
            NAME="Pulse.Web-beta-${STAMP}-${SHA}"
          else
            NAME="Pulse.Web-${STAMP}-${SHA}"
          fi
          echo "ARTIFACT_NAME=${NAME}" >> "$GITHUB_ENV"
          echo "ARTIFACT_ZIP=${NAME}.zip" >> "$GITHUB_ENV"
          echo "$TAG" > Pulse.Web/VERSION
          cd Pulse.Web
          zip -r "../${NAME}.zip" . -x "app/python/*" "__pycache__/*" "*.pyc"

      - name: Extract changelog notes
        run: |
          # Top section of the changelog (between the first two "## " headings),
          # minus its heading line — becomes the body of the release notes the
          # in-app updater shows. Generic fallback if empty/missing so a release
          # never fails on a missing-notes file.
          awk '/^## /{s++; if(s==1) next; if(s==2) exit} s>=1{print}' \
            Pulse.Web/CHANGELOG.md > CHANGELOG_BODY.md 2>/dev/null || true
          # Whitespace-only counts as empty: an unpopulated changelog section
          # yields a single blank line, which `test -s` reads as non-empty and
          # would ship notes that are literally blank.
          if ! grep -q '[^[:space:]]' CHANGELOG_BODY.md 2>/dev/null; then
            echo "- Maintenance and internal improvements." > CHANGELOG_BODY.md
          fi
          # Drop leading blank lines so the notes start at the first heading.
          sed -i '/./,$!d' CHANGELOG_BODY.md
          echo "Release-notes body:"; cat CHANGELOG_BODY.md

      - name: Assemble release body
        run: |
          # The extracted notes used to be logged here and then dropped: every
          # publish step hard-coded its own boilerplate as `body:`, so no
          # release on any channel ever carried its changelog, and the in-app
          # "Check for Update" showed install instructions instead of what
          # changed. Assemble notes + per-channel boilerplate once and hand it
          # to all three publish steps via body_path, so release notes keep
          # tracking the changelog with no hand-edited bodies.
          {
            # ##*-v not #web-*v: the latter matches "web-dev" (it ends in a
            # v) and leaves "-v1.4.0-dev-abc1234" as the version.
            echo "## What's new in ${RELEASE_TAG##*-v}"
            echo
            cat CHANGELOG_BODY.md
          } > RELEASE_BODY.md
          case "$RELEASE_TAG" in
            web-beta-v*)
              printf '%s\n' \
                '' \
                'Pulse.Web beta build - not yet promoted to main.' '' \
                'Install on a VPU (beta channel): drop a launcher on the desktop and double-click - it auto-updates from here every launch.' '' \
                '- **`Pulse-Beta.bat`** - recommended for testers. Download once; it always pulls the current launcher, so launcher fixes land automatically (no re-downloading the launcher each update).' \
                '- `run_pulse_beta.bat` - the underlying launcher (pinned to this build'"'"'s assets).' \
                >> RELEASE_BODY.md
              ;;
            web-dev-v*)
              printf '%s\n' \
                '' \
                'Pulse.Web dev build - internal testing only.' '' \
                'Note: the `run_pulse_dev.bat` launcher tracks the latest `dev`-branch commit directly, so dev users normally do not install from this tag. This release exists so the in-app "Check for Update" has something to compare against on dev-channel installs.' \
                >> RELEASE_BODY.md
              ;;
            *)
              printf '%s\n' \
                '' \
                'Public release published on this repo. Field VPUs install via `run_pulse.bat`, which auto-updates from here every launch.' '' \
                'Install on a VPU:' \
                '- Drop `run_pulse.bat` on the desktop and double-click - auto-updates every launch.' \
                >> RELEASE_BODY.md
              ;;
          esac
          echo "Assembled release body:"; cat RELEASE_BODY.md

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_ZIP }}

      # ── Clean up stale releases (keeps only the new tag's release) ──────
      - name: Delete older releases in same channel
        if: startsWith(env.RELEASE_TAG, 'web-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${RELEASE_TAG}"
          # Determine channel prefix for cleanup
          if echo "$TAG" | grep -q "^web-dev-"; then
            PATTERN="web-dev-v"
          elif echo "$TAG" | grep -q "^web-beta-"; then
            PATTERN="web-beta-v"
          else
            PATTERN="web-v"
          fi
          gh release list --limit 50 \
            | awk -F'\t' '$3 ~ /^'"$PATTERN"'/ && $3 != "'"$TAG"'" {print $3}' \
            | while read -r old; do
                echo "Deleting old release: $old"
                gh release delete "$old" --yes 2>/dev/null || true
              done
          gh release delete "$TAG" --yes 2>/dev/null || true
          echo "Cleaned up stale releases for channel ${PATTERN}*"

      # ── Production release (web-v* tags, excluding beta/dev) ───────────
      - name: Publish release (source repo)
        if: startsWith(env.RELEASE_TAG, 'web-v') && !startsWith(env.RELEASE_TAG, 'web-beta-') && !startsWith(env.RELEASE_TAG, 'web-dev-')
        uses: softprops/action-gh-release@v2
        with:
          # Ship the channel launcher alongside the app zip — testers/installers
          # only need the .bat; downloading it from the release pins them to a
          # known-good launcher paired with this build.
          files: |
            ${{ env.ARTIFACT_ZIP }}
            runners/run_pulse.bat
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: false
          body_path: RELEASE_BODY.md
      # ── Beta pre-release (beta channel, web-beta-v* tags) ──────────────
      - name: Publish beta pre-release (source repo)
        if: startsWith(env.RELEASE_TAG, 'web-beta-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT_ZIP }}
            runners/run_pulse_beta.bat
            runners/Pulse-Beta.bat
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: true
          body_path: RELEASE_BODY.md
      # ── Dev pre-release (dev channel, web-dev-v* tags) ─────────────────
      - name: Publish dev pre-release (source repo)
        if: startsWith(env.RELEASE_TAG, 'web-dev-v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ARTIFACT_ZIP }}
            runners/run_pulse_dev.bat
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          prerelease: true
          body_path: RELEASE_BODY.md